<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders — FoodCourt</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛍️</text></svg>">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="/">🍽️ Food<span>Court</span></a>
            <div class="ms-auto d-flex align-items-center gap-3">
                <a href="/" class="nav-link"><i class="bi bi-arrow-left"></i> Home</a>
                <button class="btn-outline-custom" onclick="logout()"
                    style="padding:.4rem 1.1rem;font-size:.85rem">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <h1 class="section-title">🛍️ My Orders</h1>
        <p class="section-subtitle">Track your food deliveries in real-time</p>

        <div id="orders-list">
            <div class="text-center py-5" style="color:var(--text-muted)">
                <div class="spinner-border text-warning"></div>
                <p class="mt-2">Loading orders…</p>
            </div>
        </div>
    </div>

    <div class="fc-toast-container" id="toast-container"></div>

    <!-- Review Modal -->
    <div class="modal fade" id="reviewModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="background:var(--card-bg);border:1px solid var(--border)">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title" style="font-weight:700">Write a Review</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="review-rest-id">
                    <input type="hidden" id="review-order-id">
                    <div class="mb-3 text-center">
                        <div class="star-rating" id="star-rating">
                            <i class="bi bi-star" data-val="1"></i>
                            <i class="bi bi-star" data-val="2"></i>
                            <i class="bi bi-star" data-val="3"></i>
                            <i class="bi bi-star" data-val="4"></i>
                            <i class="bi bi-star" data-val="5"></i>
                        </div>
                    </div>
                    <div class="mb-3">
                        <textarea id="review-comment" class="fc-input" rows="3"
                            placeholder="What did you like or dislike?"></textarea>
                    </div>
                    <button class="btn-primary-custom w-100" onclick="submitReview()">Submit Review</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="/static/js/main.js?v=2"></script>
    <script>
        if (!getToken() || getRole() !== 'customer') {
            window.location.href = '/login.html';
        }

        function logout() {
            localStorage.clear();
            window.location.href = '/';
        }

        const STATUS_STEPS = ['pending', 'accepted', 'preparing', 'ready', 'delivered'];

        function stepProgress(status) {
            const idx = STATUS_STEPS.indexOf(status);
            if (idx === -1) return 0;
            return Math.round((idx / (STATUS_STEPS.length - 1)) * 100);
        }

        async function loadOrders() {
            const orders = await apiFetch('/api/orders/me', true);
            const el = document.getElementById('orders-list');

            if (!Array.isArray(orders) || orders.length === 0) {
                el.innerHTML = `<div class="empty-state"><div class="icon">🛍️</div><p>No orders yet. <a href="/" style="color:var(--primary)">Start ordering!</a></p></div>`;
                return;
            }

            el.innerHTML = orders.map(o => {
                const progress = o.status === 'rejected' ? 0 : stepProgress(o.status);
                const date = new Date(o.created_at).toLocaleString();
                const items = o.items.map(i => `<span class="badge-cuisine" style="margin:.1rem">${i.quantity}× ${i.name}</span>`).join(' ');

                let reviewSection = '';
                if (o.status === 'delivered') {
                    if (o.review) {
                        reviewSection = `<div class="mt-3 p-3" style="background:rgba(255,255,255,0.05);border-radius:8px;"><strong>Your Review:</strong> ${'⭐'.repeat(o.review.rating)} <br><span class="text-muted-custom" style="font-size:0.9rem">${o.review.comment}</span></div>`;
                    } else {
                        reviewSection = `<div class="mt-3"><button class="btn-outline-custom" style="padding:0.3rem 0.8rem;font-size:0.85rem;" onclick="openReviewModal('${o.restaurant_id}', '${o._id}')"><i class="bi bi-star"></i> Write a Review</button></div>`;
                    }
                }

                let cancelBtn = '';
                if (o.status === 'pending') {
                    cancelBtn = `<div class="mt-3"><button class="btn btn-sm btn-outline-danger" onclick="cancelOrder('${o._id}')"><i class="bi bi-x-circle"></i> Cancel Order</button></div>`;
                }

                return `
      <div style="background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem;margin-bottom:1rem">
        <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-3">
          <div>
            <h3 style="font-size:1.1rem;font-weight:700;margin-bottom:.25rem">${o.restaurant_name}</h3>
            <small style="color:var(--text-muted)">${date}</small>
          </div>
          <div class="d-flex align-items-center gap-2">
            <span class="status-badge status-${o.status}">${o.status.toUpperCase()}</span>
            <strong style="color:var(--primary)">₹${o.total_price}</strong>
          </div>
        </div>
        <div class="mb-3">${items}</div>
        ${o.status === 'cancelled' ? `<div class="status-badge status-rejected d-inline-block">Order Cancelled</div>` :
          o.status !== 'rejected' ? `
        <div>
          <div style="display:flex;justify-content:space-between;font-size:0.75rem;color:var(--text-muted);margin-bottom:.35rem">
            <span>Pending</span><span>Accepted</span><span>Preparing</span><span>Ready</span><span>Delivered</span>
          </div>
          <div style="background:rgba(255,255,255,0.1);border-radius:50px;height:6px;overflow:hidden">
            <div style="background:linear-gradient(90deg,var(--primary),#ff9f43);height:100%;width:${progress}%;transition:width 1s ease;border-radius:50px"></div>
          </div>
        </div>` : `<div class="status-badge status-rejected d-inline-block">Order Rejected by restaurant</div>`}
        ${reviewSection}
        ${cancelBtn}
      </div>`;
            }).join('');
        }

        let selectedRating = 0;
        document.querySelectorAll('#star-rating i').forEach(star => {
            star.addEventListener('click', (e) => {
                selectedRating = parseInt(e.target.dataset.val);
                document.querySelectorAll('#star-rating i').forEach(s => {
                    s.className = parseInt(s.dataset.val) <= selectedRating ? 'bi bi-star-fill text-warning' : 'bi bi-star';
                });
            });
        });

        function openReviewModal(restId, orderId) {
            document.getElementById('review-rest-id').value = restId;
            document.getElementById('review-order-id').value = orderId;
            selectedRating = 0;
            document.querySelectorAll('#star-rating i').forEach(s => s.className = 'bi bi-star');
            document.getElementById('review-comment').value = '';
            new bootstrap.Modal(document.getElementById('reviewModal')).show();
        }

        async function submitReview() {
            const restId = document.getElementById('review-rest-id').value;
            const orderId = document.getElementById('review-order-id').value;
            const comment = document.getElementById('review-comment').value.trim();
            if (selectedRating === 0) { showToast('Please select a rating', 'error'); return; }

            const res = await apiPost('/api/review', { restaurant_id: restId, order_id: orderId, rating: selectedRating, comment }, true);
            if (res.message) {
                bootstrap.Modal.getInstance(document.getElementById('reviewModal')).hide();
                showToast('Review submitted successfully!', 'success');
                loadOrders();
            } else {
                showToast(res.error || 'Failed to submit review', 'error');
            }
        }

        async function cancelOrder(orderId) {
            if (!confirm('Cancel this order?')) return;
            const res = await apiPost(`/api/order/${orderId}/cancel`, {}, true);
            if (res.message) {
                showToast('Order cancelled successfully', 'success');
                loadOrders();
            } else {
                showToast(res.error || 'Could not cancel order', 'error');
            }
        }

        loadOrders();
        // Auto-refresh every 30 seconds
        setInterval(loadOrders, 30000);
    </script>
</body>

</html>
