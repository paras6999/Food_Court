<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Portal — FoodCourt</title>
    <meta name="description" content="Restaurant partner login and registration for FoodCourt.">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍳</text></svg>">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body class="auth-page">
    <div class="fc-toast-container" id="toast-container"></div>

    <div class="auth-card" style="max-width:520px">
        <div class="text-center mb-4">
            <div style="font-size:3rem">🧑‍🍳</div>
            <h1 style="font-size:1.8rem;font-weight:800">Restaurant Portal</h1>
            <p style="color:var(--text-muted)">Manage your restaurant on FoodCourt</p>
        </div>

        <!-- Tabs -->
        <ul class="nav nav-pills justify-content-center mb-4" id="authTabs">
            <li class="nav-item">
                <button class="nav-link active" onclick="switchTab('login')">Login</button>
            </li>
            <li class="nav-item">
                <button class="nav-link" onclick="switchTab('register')">Register</button>
            </li>
        </ul>

        <!-- Login Form -->
        <form id="login-form">
            <div class="mb-3">
                <label class="fc-label">Email</label>
                <input type="email" class="fc-input" id="login-email" placeholder="restaurant@example.com" required>
            </div>
            <div class="mb-4">
                <label class="fc-label">Password</label>
                <input type="password" class="fc-input" id="login-password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-primary-custom w-100 justify-content-center" id="login-btn">
                <i class="bi bi-box-arrow-in-right"></i> Sign In
            </button>
        </form>

        <!-- Register Form (hidden by default) -->
        <form id="register-form" style="display:none">
            <div class="row g-3">
                <div class="col-12">
                    <label class="fc-label">Restaurant Name</label>
                    <input type="text" class="fc-input" id="reg-name" placeholder="e.g. Pizza Hub" required>
                </div>
                <div class="col-12">
                    <label class="fc-label">Owner Name</label>
                    <input type="text" class="fc-input" id="reg-owner" placeholder="Your full name" required>
                </div>
                <div class="col-12">
                    <label class="fc-label">Cuisine Type</label>
                    <select class="fc-input" id="reg-cuisine" required>
                        <option value="">Select cuisine…</option>
                        <option>Italian</option>
                        <option>American</option>
                        <option>Japanese</option>
                        <option>Chinese</option>
                        <option>Indian</option>
                        <option>Mexican</option>
                        <option>Thai</option>
                        <option>Mediterranean</option>
                        <option>Other</option>
                    </select>
                </div>
                <div class="col-12">
                    <label class="fc-label">Email</label>
                    <input type="email" class="fc-input" id="reg-email" placeholder="restaurant@example.com" required>
                </div>
                <div class="col-12 mb-2">
                    <label class="fc-label">Password</label>
                    <input type="password" class="fc-input" id="reg-password" placeholder="Min 6 characters" required
                        minlength="6">
                </div>
            </div>
            <button type="submit" class="btn-primary-custom w-100 justify-content-center mt-3" id="register-btn">
                <i class="bi bi-shop"></i> Register Restaurant
            </button>
        </form>

        <p class="text-center mt-4" style="color:var(--text-muted);font-size:0.85rem">
            <a href="/" style="color:var(--text-muted)"><i class="bi bi-arrow-left"></i> Back to home</a>
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/main.js"></script>
    <script>
        if (getToken() && getRole() === 'restaurant') { window.location.href = '/restaurant_dashboard.html'; }

        function switchTab(tab) {
            const tabs = document.querySelectorAll('#authTabs .nav-link');
            tabs.forEach((t, i) => { t.classList.toggle('active', (i === 0 && tab === 'login') || (i === 1 && tab === 'register')); });
            document.getElementById('login-form').style.display = tab === 'login' ? '' : 'none';
            document.getElementById('register-form').style.display = tab === 'register' ? '' : 'none';
        }

        document.getElementById('login-form').addEventListener('submit', async e => {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';
            btn.disabled = true;
            const res = await apiPost('/api/restaurant/login', {
                email: document.getElementById('login-email').value,
                password: document.getElementById('login-password').value
            });
            if (res.token) {
                localStorage.setItem('fc_token', res.token);
                localStorage.setItem('fc_role', 'restaurant');
                localStorage.setItem('fc_name', res.name);
                localStorage.setItem('fc_id', res.id);
                showToast('Welcome back, ' + res.name + ' 🎉', 'success');
                setTimeout(() => window.location.href = '/restaurant_dashboard.html', 1000);
            } else {
                showToast(res.error || 'Login failed', 'error');
                btn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> Sign In';
                btn.disabled = false;
            }
        });

        document.getElementById('register-form').addEventListener('submit', async e => {
            e.preventDefault();
            const btn = document.getElementById('register-btn');
            btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';
            btn.disabled = true;
            const res = await apiPost('/api/restaurant/register', {
                name: document.getElementById('reg-name').value,
                ownerName: document.getElementById('reg-owner').value,
                cuisine: document.getElementById('reg-cuisine').value,
                email: document.getElementById('reg-email').value,
                password: document.getElementById('reg-password').value
            });
            if (res.token) {
                localStorage.setItem('fc_token', res.token);
                localStorage.setItem('fc_role', 'restaurant');
                localStorage.setItem('fc_name', res.name);
                localStorage.setItem('fc_id', res.id);
                showToast('Restaurant registered! 🎉', 'success');
                setTimeout(() => window.location.href = '/restaurant_dashboard.html', 1000);
            } else {
                showToast(res.error || 'Registration failed', 'error');
                btn.innerHTML = '<i class="bi bi-shop"></i> Register Restaurant';
                btn.disabled = false;
            }
        });
    </script>
</body>

</html>
