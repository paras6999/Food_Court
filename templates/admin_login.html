<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — FoodCourt</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body class="auth-page">
    <div class="fc-toast-container" id="toast-container"></div>

    <div class="auth-card">
        <div class="text-center mb-4">
            <div style="font-size:3rem">🛡️</div>
            <h1 style="font-size:1.8rem;font-weight:800">Admin Portal</h1>
            <p style="color:var(--text-muted)">Restricted access — FoodCourt administrators only</p>
        </div>

        <form id="admin-login-form">
            <div class="mb-3">
                <label class="fc-label">Admin Email</label>
                <input type="email" class="fc-input" id="email" placeholder="admin@foodcourt.com" required>
            </div>
            <div class="mb-4">
                <label class="fc-label">Password</label>
                <input type="password" class="fc-input" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-primary-custom w-100 justify-content-center" id="login-btn">
                <i class="bi bi-shield-lock"></i> Admin Sign In
            </button>
        </form>

        <p class="text-center mt-4" style="color:var(--text-muted);font-size:0.85rem">
            <a href="/" style="color:var(--text-muted)"><i class="bi bi-arrow-left"></i> Back to home</a>
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/main.js"></script>
    <script>
        if (getToken() && getRole() === 'admin') { window.location.href = '/admin_dashboard.html'; }

        document.getElementById('admin-login-form').addEventListener('submit', async e => {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';
            btn.disabled = true;
            const res = await apiPost('/api/admin/login', {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            });
            if (res.token) {
                localStorage.setItem('fc_token', res.token);
                localStorage.setItem('fc_role', 'admin');
                localStorage.setItem('fc_name', res.name);
                localStorage.setItem('fc_id', 'admin');
                showToast('Welcome, Admin 🛡️', 'success');
                setTimeout(() => window.location.href = '/admin_dashboard.html', 1000);
            } else {
                showToast(res.error || 'Login failed', 'error');
                btn.innerHTML = '<i class="bi bi-shield-lock"></i> Admin Sign In';
                btn.disabled = false;
            }
        });
    </script>
</body>

</html>
