<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — FoodCourt</title>
    <meta name="description" content="Login to your FoodCourt account to order food.">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍔</text></svg>">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body class="auth-page">
    <div class="fc-toast-container" id="toast-container"></div>

    <div class="auth-card">
        <div class="text-center mb-4">
            <div style="font-size:3rem">🍽️</div>
            <h1 style="font-size:1.8rem;font-weight:800">Welcome Back</h1>
            <p style="color:var(--text-muted)">Sign in to your FoodCourt account</p>
        </div>

        <form id="login-form">
            <div class="mb-3">
                <label class="fc-label"><i class="bi bi-envelope me-1"></i>Email</label>
                <input type="email" class="fc-input" id="email" placeholder="you@example.com" required>
            </div>
            <div class="mb-4">
                <label class="fc-label"><i class="bi bi-lock me-1"></i>Password</label>
                <input type="password" class="fc-input" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-primary-custom w-100 justify-content-center" id="submit-btn">
                <i class="bi bi-box-arrow-in-right"></i> Sign In
            </button>
        </form>

        <hr class="divider my-4">

        <!-- Google Sign-In Button -->
        <div id="g_id_onload" data-client_id="77957118883-n0f61t165nj05m29q01k953rb3q7afun.apps.googleusercontent.com"
            data-context="signin" data-ux_mode="popup" data-callback="handleGoogleCredentialResponse"
            data-auto_prompt="false">
        </div>
        <div class="g_id_signin mb-4" data-type="standard" data-shape="pill" data-theme="outline"
            data-text="continue_with" data-size="large" data-logo_alignment="left"
            style="display:flex;justify-content:center;">
        </div>

        <p class="text-center" style="color:var(--text-muted)">
            Don't have an account?
            <a href="/register.html" style="color:var(--primary);font-weight:600">Create one</a>
        </p>
        <p class="text-center" style="color:var(--text-muted);font-size:0.85rem">
            <a href="/" style="color:var(--text-muted)"><i class="bi bi-arrow-left"></i> Back to home</a>
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/main.js"></script>
    <script>
        // Redirect if already logged in
        if (getToken() && getRole() === 'customer') { window.location.href = '/'; }

        document.getElementById('login-form').addEventListener('submit', async e => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Signing in…';
            btn.disabled = true;

            const res = await apiPost('/api/login', {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            });

            if (res.token) {
                localStorage.setItem('fc_token', res.token);
                localStorage.setItem('fc_role', res.role);
                localStorage.setItem('fc_name', res.name);
                localStorage.setItem('fc_id', res.id);
                showToast('Welcome back, ' + res.name + '! 🎉', 'success');
                setTimeout(() => window.location.href = '/', 1000);
            } else {
                showToast(res.error || 'Login failed', 'error');
                btn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> Sign In';
                btn.disabled = false;
            }
        });

        // Google Auth Callback
        async function handleGoogleCredentialResponse(response) {
            const res = await apiPost('/api/auth/google', {
                credential: response.credential
            });

            if (res.token) {
                localStorage.setItem('fc_token', res.token);
                localStorage.setItem('fc_role', res.role);
                localStorage.setItem('fc_name', res.name);
                localStorage.setItem('fc_id', res.id);
                showToast('Welcome back, ' + res.name + '! 🎉', 'success');
                setTimeout(() => window.location.href = '/', 1000);
            } else {
                showToast(res.error || 'Google login failed', 'error');
            }
        }
    </script>
</body>

</html>
