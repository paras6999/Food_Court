<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu — FoodCourt</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍽️</text></svg>">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg" style="border-bottom: 1px solid var(--border); background: var(--surface);">
        <div class="container">
            <a class="navbar-brand" href="/" style="font-weight: 700; font-size: 1.25rem;">🍽️ FoodCourt</a>
            <div class="ms-auto d-flex align-items-center gap-3">
                <button class="btn btn-link p-0 text-decoration-none" onclick="toggleProfessionalTheme()" id="theme-toggle-btn" style="color:var(--text-primary);">
                    <i class="bi bi-moon-stars" style="font-size: 1.2rem;"></i>
                </button>
                <div class="dropdown">
                    <button class="btn p-0 border-0" type="button" data-bs-toggle="dropdown" aria-expanded="false" style="color: var(--text-primary);">
                        <i class="bi bi-list" style="font-size: 1.8rem;"></i>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end p-2" style="background:var(--surface); border:1px solid var(--border); min-width: 200px; border-radius: 12px; box-shadow: var(--shadow-lg); margin-top: 10px;">
                        <li id="nav-user-info" style="display:none">
                            <div class="px-3 py-2 mb-1" style="font-size: 0.85rem; color: var(--text-muted); border-bottom: 1px solid var(--border);">
                                <i class="bi bi-person-circle me-1"></i> <span id="nav-username">User</span>
                            </div>
                        </li>
                        <li><a class="dropdown-item rounded-2" href="/"><i class="bi bi-house me-2"></i>Home</a></li>
                        <li id="nav-orders-item" style="display:none"><a class="dropdown-item rounded-2" href="/orders.html"><i class="bi bi-bag-check me-2"></i>My Orders</a></li>
                        <li id="nav-login-item"><a class="dropdown-item rounded-2" href="/login.html"><i class="bi bi-box-arrow-in-right me-2"></i>Login</a></li>
                        <li id="nav-register-item"><a class="dropdown-item rounded-2" href="/register.html"><i class="bi bi-person-plus me-2"></i>Sign Up</a></li>
                        <li><hr class="dropdown-divider" style="border-color:var(--border)"></li>
                        <li><a class="dropdown-item rounded-2" href="/restaurant_auth.html"><i class="bi bi-shop me-2"></i>Restaurant Panel</a></li>
                        <li><a class="dropdown-item rounded-2" href="/admin_login.html"><i class="bi bi-shield-lock me-2"></i>Admin Panel</a></li>
                        <li id="nav-logout-item" style="display:none">
                            <hr class="dropdown-divider" style="border-color:var(--border)">
                            <a class="dropdown-item rounded-2 text-danger" href="#" id="logout-btn"><i class="bi bi-box-arrow-right me-2"></i>Logout</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <!-- RESTAURANT HEADER -->
    <div id="rest-header"
        style="background:linear-gradient(135deg, var(--secondary), var(--surface));padding:2.5rem 0;border-bottom:1px solid var(--border)">
        <div class="container">
            <div class="d-flex align-items-center gap-4 flex-wrap">
                <img id="rest-img" src="" alt=""
                    style="width:110px;height:110px;border-radius:var(--radius);object-fit:cover;border:2px solid var(--border)">
                <div>
                    <h1 id="rest-name" class="section-title mb-1">Loading…</h1>
                    <div class="d-flex align-items-center gap-2 flex-wrap">
                        <span id="rest-cuisine" class="badge-cuisine"></span>
                        <span id="rest-rating" class="stars"></span>
                    </div>
                    <!-- Offer banner -->
                    <div id="offer-banner" class="offer-banner mt-3" style="display:none">
                        <i class="bi bi-tags-fill"></i> <span id="offer-text"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MENU ITEMS -->
    <section class="py-5">
        <div class="container">
            <div class="d-flex gap-2 mb-4">
                <button class="pill" id="filter-veg" onclick="toggleMenuFilter('veg')">🟢 Veg Only</button>
                <button class="pill" id="filter-best" onclick="toggleMenuFilter('best')">🔥 Bestsellers</button>
            </div>
            <div class="row g-3" id="menu-grid">
                <!-- Skeletons -->
                <div class="col-12 col-md-6 col-lg-4">
                    <div class="fc-card" style="padding:1rem">
                        <div class="d-flex gap-3">
                            <div class="skeleton" style="width:100px; height:100px; border-radius:12px"></div>
                            <div style="flex:1">
                                <div class="skeleton" style="height:1.2rem;width:80%;margin-bottom:.5rem"></div>
                                <div class="skeleton" style="height:.9rem;width:40%;margin-bottom:1rem"></div>
                                <div class="skeleton" style="height:2rem;width:60%"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-md-6 col-lg-4">
                    <div class="fc-card" style="padding:1rem">
                        <div class="d-flex gap-3">
                            <div class="skeleton" style="width:100px; height:100px; border-radius:12px"></div>
                            <div style="flex:1">
                                <div class="skeleton" style="height:1.2rem;width:80%;margin-bottom:.5rem"></div>
                                <div class="skeleton" style="height:.9rem;width:40%;margin-bottom:1rem"></div>
                                <div class="skeleton" style="height:2rem;width:60%"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-md-6 col-lg-4 d-none d-lg-block">
                    <div class="fc-card" style="padding:1rem">
                        <div class="d-flex gap-3">
                            <div class="skeleton" style="width:100px; height:100px; border-radius:12px"></div>
                            <div style="flex:1">
                                <div class="skeleton" style="height:1.2rem;width:80%;margin-bottom:.5rem"></div>
                                <div class="skeleton" style="height:.9rem;width:40%;margin-bottom:1rem"></div>
                                <div class="skeleton" style="height:2rem;width:60%"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Reviews Section -->
            <div class="mt-5">
                <h2 class="section-title" style="font-size:1.4rem">⭐ Reviews</h2>
                <div id="reviews-list" class="mt-3"></div>
                <!-- Leave a review form (shown only when logged in as customer) -->
                <div id="review-form-wrapper" style="display:none" class="mt-4">
                    <div
                        style="background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem">
                        <h3 style="font-size:1.1rem;font-weight:700;margin-bottom:1rem">Leave a Review</h3>
                        <div class="mb-3">
                            <label class="fc-label">Rating</label>
                            <div class="d-flex gap-2" id="star-picker" style="font-size:1.5rem;cursor:pointer">
                                <span onclick="setRating(1)">☆</span><span onclick="setRating(2)">☆</span>
                                <span onclick="setRating(3)">☆</span><span onclick="setRating(4)">☆</span><span
                                    onclick="setRating(5)">☆</span>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="fc-label">Comment (optional)</label>
                            <textarea class="fc-input" id="review-comment" rows="2"
                                placeholder="Share your experience…"></textarea>
                        </div>
                        <button class="btn-primary-custom" onclick="submitReview()">
                            <i class="bi bi-send"></i> Submit Review
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- FLOATING CART -->
    <div class="cart-btn-floating" id="cart-fab" style="display:none">
        <button class="btn-primary-custom position-relative"
            style="width:60px;height:60px;border-radius:50%;padding:0;justify-content:center;font-size:1.4rem"
            data-bs-toggle="offcanvas" data-bs-target="#cartSidebar">
            🛒
            <span class="cart-count" id="cart-badge">0</span>
        </button>
    </div>

    <!-- CART SIDEBAR -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="cartSidebar">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title">🛒 Your Cart</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body d-flex flex-column" style="overflow-y:auto">
            <div id="cart-items-list" class="flex-grow-1"></div>
            <div id="cart-footer"
                style="display:none;border-top:1px solid var(--border);padding-top:1rem;margin-top:1rem">
                <div class="mb-3">
                    <label class="fc-label">Coupon Code</label>
                    <div class="d-flex gap-2">
                        <input type="text" class="fc-input" id="cart-coupon" placeholder="Enter coupon..." style="flex:1; text-transform:uppercase;">
                        <button class="btn btn-outline-custom" onclick="applyCoupon()" style="padding: 0 1rem; border-color:var(--border); color:var(--text);">Apply</button>
                    </div>
                    <div id="coupon-message" style="font-size: 0.85rem; margin-top: 0.25rem;"></div>
                </div>
                <div class="mb-3" id="cart-points-container" style="display:none;">
                    <div class="form-check d-flex align-items-center gap-2" style="background:rgba(255,107,53,0.1); padding:0.5rem 1rem; border-radius:8px; border:1px solid rgba(255,107,53,0.2);">
                        <input class="form-check-input" type="checkbox" id="cart-use-points" onchange="renderCart()" style="margin-top:0;">
                        <label class="form-check-label mb-0 w-100 d-flex justify-content-between align-items-center" for="cart-use-points" style="color:var(--text-primary); cursor:pointer;">
                            <span id="cart-points-label"><i class="bi bi-star-fill text-warning"></i> Use 0 Points</span>
                            <strong class="text-success" id="cart-points-savings">Save ₹0</strong>
                        </label>
                    </div>
                </div>
                <div class="d-flex justify-content-between mb-2">
                    <span style="color:var(--text-muted)">Subtotal</span>
                    <strong id="cart-subtotal">$0.00</strong>
                </div>
                <div class="d-flex justify-content-between mb-2 text-success" id="cart-discount-row" style="display:none !important;">
                    <span>Discount</span>
                    <strong id="cart-discount">-$0.00</strong>
                </div>
                <div class="d-flex justify-content-between mb-3 border-top pt-2" style="border-color:var(--border) !important;">
                    <span style="font-weight:bold;">Total</span>
                    <strong id="cart-total" style="font-size:1.1rem; color:var(--primary);">$0.00</strong>
                </div>
                <div class="mb-3">
                    <label class="fc-label">Delivery Address</label>
                    <textarea class="fc-input" id="cart-address" rows="2"
                        placeholder="Enter your delivery address…"></textarea>
                </div>
                <div class="d-flex gap-2">
                    <button id="checkout-btn-razorpay" class="btn btn-primary-custom w-100 justify-content-center" onclick="checkout('razorpay')">
                        <i class="bi bi-credit-card"></i> Pay Online
                    </button>
                    <button id="checkout-btn-cod" class="btn btn-outline-custom w-100 justify-content-center" style="border-color:var(--border);color:var(--text)" onclick="checkout('cod')">
                        <i class="bi bi-cash"></i> COD
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="fc-toast-container" id="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="/static/js/main.js"></script>
    <script src="/static/js/customer.js"></script>
    <script>
        initNavbar();
        const params = new URLSearchParams(window.location.search);
        const restId = params.get('id');
        if (!restId) { window.location.href = '/'; }

        let currentRating = 0;
        let currentRestaurantData = null;

        let originalMenuItems = [];
        let currentMenuFilters = { veg: false, best: false };

        async function loadRestaurantMenu() {
            // Load restaurant details from the restaurants list
            const rests = await apiFetch('/api/restaurants');
            const rest = Array.isArray(rests) ? rests.find(r => r._id === restId) : null;
            currentRestaurantData = rest;
            let restName = "Restaurant";
            if (rest) {
                restName = rest.name.replace(/'/g, "\\'");
                document.getElementById('rest-name').textContent = rest.name;
                document.getElementById('rest-cuisine').textContent = rest.cuisine;
                document.getElementById('rest-img').src = rest.image || 'https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=300';
                document.getElementById('rest-rating').innerHTML = renderStars(rest.rating) + ` <span class="rating-num">${rest.rating} (${rest.totalRatings || 0})</span>`;
                document.title = rest.name + ' — FoodCourt';
                
                if (rest.offer) {
                    document.getElementById('offer-banner').style.display = '';
                    document.getElementById('offer-text').textContent = rest.offer;
                }
            }

            const items = await apiFetch(`/api/menu/${restId}`);
            if (!Array.isArray(items)) {
                document.getElementById('menu-grid').innerHTML = '<div class="col-12"><div class="empty-state"><div class="icon">🍽️</div><p>Failed to load menu.</p></div></div>';
                return;
            }
            originalMenuItems = items.map(item => {
                // Mock isVeg and isBestseller based on name for demonstration
                const nameLower = item.name.toLowerCase();
                const isVeg = !(nameLower.includes('chicken') || nameLower.includes('beef') || nameLower.includes('pork') || nameLower.includes('fish') || nameLower.includes('meat') || nameLower.includes('egg'));
                const isBestseller = item.price > 150 && item.price < 300;
                return { ...item, isVeg, isBestseller, restName };
            });
            
            renderMenuItems();
        }
        
        function toggleMenuFilter(type) {
            currentMenuFilters[type] = !currentMenuFilters[type];
            const btn = document.getElementById(`filter-${type}`);
            if (currentMenuFilters[type]) btn.classList.add('active');
            else btn.classList.remove('active');
            renderMenuItems();
        }

        function renderMenuItems() {
            const grid = document.getElementById('menu-grid');
            
            let filtered = originalMenuItems;
            if (currentMenuFilters.veg) filtered = filtered.filter(i => i.isVeg);
            if (currentMenuFilters.best) filtered = filtered.filter(i => i.isBestseller);
            
            if (filtered.length === 0) {
                grid.innerHTML = '<div class="col-12"><div class="empty-state"><div class="icon">🍽️</div><p>No menu items match your filters.</p></div></div>';
                return;
            }
            const isLoggedIn = !!localStorage.getItem('fc_token');
            const discount = isLoggedIn && currentRestaurantData && currentRestaurantData.discount_pct ? parseFloat(currentRestaurantData.discount_pct) : 0;

            grid.innerHTML = filtered.map(item => {
                let priceHtml = '';
                if (discount > 0) {
                    const discountedPrice = (item.price * (1 - discount / 100)).toFixed(2);
                    priceHtml = `<span style="text-decoration:line-through; color:var(--text-muted); font-size:0.85rem">₹${item.price}</span> <span style="color: #20c997; font-weight: bold;">₹${discountedPrice}</span>`;
                } else {
                    priceHtml = `₹${item.price}`;
                }
                
                return `
      <div class="col-12 col-md-6">
        <div class="menu-card" style="cursor:pointer" onclick="openItemDetails('${item._id}', '${item.name.replace(/'/g, "\\'")}', ${item.price}, '${restId}', '${item.restName}', '${item.image || ''}', '${item.description || ''}', ${item.isVeg}, '${item.addons || ''}')">
          <img src="${item.image || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=200'}" alt="${item.name}"
               onerror="this.src='https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=200'">
          <div class="details">
            <div class="name">
                ${item.isVeg ? '<span style="font-size:0.7rem">🟢</span>' : '<span style="font-size:0.7rem">🔴</span>'}
                ${item.name}
            </div>
            <div class="price">${priceHtml}</div>
          </div>
          <div class="ms-auto">
            <button class="btn-primary-custom" style="padding:0.45rem 1rem;font-size:0.85rem"
              onclick="event.stopPropagation(); openItemDetails('${item._id}', '${item.name.replace(/'/g, "\\'")}', ${item.price}, '${restId}', '${item.restName}', '${item.image || ''}', '${item.description || ''}', ${item.isVeg}, '${item.addons || ''}')">
              <i class="bi bi-plus-lg"></i> Add
            </button>
          </div>
        </div>
      </div>
    `}).join('');
        }

        async function loadReviews() {
            const reviews = await apiFetch(`/api/reviews/${restId}`);
            const list = document.getElementById('reviews-list');
            if (!list) return;

            if (!Array.isArray(reviews) || reviews.length === 0) {
                list.innerHTML = '<p style="color:var(--text-muted); text-align:center; padding:1rem;">No reviews yet. Be the first!</p>';
                return;
            }
            list.innerHTML = reviews.map(r => `
      <div style="background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:1rem;margin-bottom:0.75rem">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <strong>${r.user_name}</strong>
          <span class="stars">${'★'.repeat(Math.round(r.rating))}${'☆'.repeat(5 - Math.round(r.rating))}</span>
        </div>
        ${r.comment ? `<p style="color:var(--text-muted);font-size:0.9rem;margin:0">${r.comment}</p>` : '<p style="color:var(--text-muted);font-size:0.85rem;margin:0;font-style:italic">No comment left</p>'}
      </div>
    `).join('');
        }

        function setRating(n) {
            currentRating = n;
            const stars = document.querySelectorAll('#star-picker span');
            stars.forEach((s, i) => { s.textContent = i < n ? '★' : '☆'; s.style.color = i < n ? 'var(--gold)' : ''; });
        }

        async function submitReview() {
            if (!currentRating) { showToast('Please select a rating', 'error'); return; }
            const res = await apiPost('/api/review', {
                restaurant_id: restId,
                rating: currentRating,
                comment: document.getElementById('review-comment').value
            }, true);
            if (res.message) {
                showToast('Review submitted! ⭐', 'success');
                document.getElementById('review-comment').value = '';
                setRating(0);
                loadReviews();
            } else {
                showToast(res.error || 'Failed to submit review', 'error');
            }
        }

        // Show review form only for logged-in customers
        if (getToken() && getRole() === 'customer') {
            document.getElementById('review-form-wrapper').style.display = '';
        }

        renderCart();
        loadRestaurantMenu();
        loadReviews();
    </script>
</body>

</html>
